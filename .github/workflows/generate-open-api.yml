name: Generate OpenAPI and Trigger Frontend

on:
  push:
    branches: [main]

jobs:
  generate-openapi:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup ASP.NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0

      - name: Install dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Install swagger cli
        run: dotnet tool install --global Swashbuckle.AspNetCore.Cli

      - name: Generate swagger.json
        run: |
          dotnet swagger tofile \
            --output swagger.json \
            bin/Release/net9.0/WebApi.dll v1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: swagger
          path: swagger.json

      - name: Trigger frontend
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/kuairen-227/pm-app-frontend/dispatches \
            -d '{"event_type":"backend-updated"}'
