name: Generate OpenAPI and Trigger Frontend

on:
  push:
    branches: [main]

jobs:
  generate-openapi:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup ASP.NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0

      - name: Install dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Install NSwag
        run: dotnet tool install --global NSwag.ConsoleCore --version 14.0.0

      - name: Generate OpenAPI
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Database=dummy;Username=dummy;Password=dummy"
        run: |
          ~/.dotnet/tools/nswag aspnetcore2openapi \
            /project:WebApi.Api/WebApi.Api.csproj \
            /output:swagger.json

      - name: Upload swagger
        uses: actions/upload-artifact@v4
        with:
          name: swagger
          path: swagger.json
