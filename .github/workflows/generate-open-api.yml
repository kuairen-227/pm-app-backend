name: Generate OpenAPI and Trigger Frontend

on:
  push:
    branches: [main]

jobs:
  generate-openapi:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup ASP.NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0

      - name: Install dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Install NSwag
        run: dotnet tool install --global NSwag.ConsoleCore

      - name: Restore tools
        run: dotnet tool restore

      - name: Generate OpenAPI
        run: |
          dotnet tool run nswag aspnetcore2openapi \
            /project:WebApi.Api/WebApi.Api.csproj \
            /output:swagger.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: swagger
          path: swagger.json
