name: Generate OpenAPI and Trigger Frontend

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  generate-openapi:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup ASP.NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0

      - name: Install dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Install NSwag
        run: dotnet tool install --global NSwag.ConsoleCore --version 14.0.0

      - name: Generate OpenAPI
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Database=dummy;Username=dummy;Password=dummy"
        run: |
          ~/.dotnet/tools/nswag aspnetcore2openapi \
            /project:WebApi.Api/WebApi.Api.csproj \
            /output:swagger.json

      - name: Upload swagger
        uses: actions/upload-artifact@v4
        with:
          name: swagger
          path: swagger.json

      - name: Trigger frontend CI
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.FRONTEND_DISPATCH_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            https://api.github.com/repos/kuairen-227/pm-app-frontend/dispatches \
            -d '{
              "event_type": "backend-updated",
              "client_payload": {
                "commit_sha": "${GITHUB_SHA}",
                "commit_message": "${GITHUB_EVENT_HEAD_COMMIT_MESSAGE:-Generated OpenAPI Update}"
              }
            }'
